<!doctype html>
<html lang="ja">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Dark War VS Guide</title>
<style>
:root{--bg:#0b1020;--card:#151d31;--card2:#1c263d;--text:#f5f7fb;--muted:#aab4c8;--line:#2b3753;--accent:#58e0c4;--warn:#f7d154}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#08101e,#0b1020 35%,#101827);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 14px calc(26px + env(safe-area-inset-bottom));min-height:100vh}
header{position:sticky;top:0;z-index:10;background:rgba(11,16,32,.94);backdrop-filter:blur(14px);padding:10px 0 12px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0 0 10px}
.lang,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}
.timezone-box{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.timezone-box label{color:var(--muted);font-size:13px}
.timezone-box select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 34px 9px 11px;max-width:100%}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 12px}
button.active{background:var(--accent);color:#06231e;border-color:transparent;font-weight:700}
.tabs{overflow:auto;flex-wrap:nowrap;padding-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.day-title{font-size:26px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px}
.section-title{font-size:17px;margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.list{padding-left:22px;line-height:1.65}
.time-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.time-grid{display:grid;grid-template-columns:1fr 1.25fr;min-width:360px;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:12px}
.time-grid div{background:var(--card);padding:9px 5px;text-align:center}
.time-grid .head{font-weight:700;background:#202b43}
.task-time{background:#10182a;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.task-time strong{display:block;margin-bottom:8px}
.task-time div{line-height:1.5}
.check{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:23px;height:23px;margin-top:1px;accent-color:var(--accent)}
.check label{line-height:1.45;flex:1}
.progress{height:8px;background:#26324c;border-radius:99px;overflow:hidden;margin:10px 0 14px}
.progress span{display:block;height:100%;background:var(--accent)}
.note{font-size:13px;color:var(--muted)}
footer{font-size:12px;color:var(--muted);text-align:center;padding:20px}
@media(max-width:520px){.time-grid{font-size:10.5px}.time-grid div{padding:8px 3px}}
</style>
</head>

</header>
<main id="main"></main>

let lang=localStorage.getItem("dw_lang")||"ja";
let current=localStorage.getItem("dw_tab")||"time";
const keys=["monday","tuesday","wednesday","thursday","friday"];
const deviceZone=Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC";
let selectedZone=localStorage.getItem("dw_timezone")||"auto";
const zoneOptions=[
  ["auto",null],
  ["Asia/Tokyo","Asia/Tokyo"],
  ["Europe/Rome","Europe/Rome"],
  ["America/New_York","America/New_York"],
  ["America/Chicago","America/Chicago"],
  ["America/Denver","America/Denver"],
  ["America/Los_Angeles","America/Los_Angeles"],
  ["UTC","UTC"]
];
const zoneLabels={
  ja:{"Asia/Tokyo":"日本","Europe/Rome":"イタリア","America/New_York":"米国東部","America/Chicago":"米国中部","America/Denver":"米国山岳部","America/Los_Angeles":"米国太平洋","UTC":"UTC"},
  it:{"Asia/Tokyo":"Giappone","Europe/Rome":"Italia","America/New_York":"USA orientale","America/Chicago":"USA centrale","America/Denver":"USA montagne","America/Los_Angeles":"USA Pacifico","UTC":"UTC"},
  en:{"Asia/Tokyo":"Japan","Europe/Rome":"Italy","America/New_York":"US Eastern","America/Chicago":"US Central","America/Denver":"US Mountain","America/Los_Angeles":"US Pacific","UTC":"UTC"}
};

function tx(){return T[lang]}
function activeZone(){return selectedZone==="auto"?deviceZone:selectedZone}
function setLang(v){lang=v;localStorage.setItem("dw_lang",v);document.documentElement.lang=v;renderAll()}
function setTab(v){current=v;localStorage.setItem("dw_tab",v);renderAll()}
function setZone(v){selectedZone=v;localStorage.setItem("dw_timezone",v);renderAll()}
function serverRangeToZone(range,zone=activeZone()){
  const m=range.match(/^(\d{2}):(\d{2})[–-](\d{2}):(\d{2})$/);
  if(!m)return range;
  const now=new Date();
  const y=now.getUTCFullYear(),mo=now.getUTCMonth(),d=now.getUTCDate();
  const start=Date.UTC(y,mo,d,Number(m[1])+2,Number(m[2])); // Server time = UTC−2
  let end=Date.UTC(y,mo,d,Number(m[3])+2,Number(m[4]));
  if(end<=start)end+=86400000;
  const locale=lang==="ja"?"ja-JP":lang==="it"?"it-IT":"en-GB";
  const fmt=new Intl.DateTimeFormat(locale,{timeZone:zone,hour:"2-digit",minute:"2-digit",hour12:false});
  return `${fmt.format(new Date(start))}–${fmt.format(new Date(end))}`;
}
function zoneDisplayName(){
  const z=activeZone();
  if(selectedZone==="auto")return `${tx().automatic}: ${z}`;
  return `${zoneLabels[lang][z]||z} (${z})`;
}
function commonView(){
let rows=commonTimes.map(r=>`<div>${r[0]}</div><div>${serverRangeToZone(r[0])}</div>`).join("");
return `<div class="card"><h2>${tx().common}</h2><p class="note">🌐 Server Time = UTC−2<br>📍 ${tx().currentZone}: ${zoneDisplayName()}<br>☀️/❄️ ${lang==="ja"?"夏時間・冬時間は自動計算されます。":lang==="it"?"L’ora legale e l’ora solare vengono calcolate automaticamente.":"Daylight saving and standard time are calculated automatically."}</p><div class="time-scroll"><div class="time-grid"><div class="head">${tx().server}</div><div class="head">${tx().local}</div>${rows}</div></div></div><div class="card"><h3>${tx().weekend}</h3><p>${tx().none}</p></div>`;
}
function dayView(k){
const d=D[k],i=keys.indexOf(k),checks=d.check[lang];
const done=checks.filter((_,n)=>localStorage.getItem(`dw_${k}_${n}`)==="1").length;
const pct=Math.round(done/checks.length*100);
const times=d.times.map(x=>`<div class="task-time"><strong>${x[0]}</strong><div>🌐 ${tx().server}: ${x[1]}</div><div>📍 ${tx().local}: ${serverRangeToZone(x[1])}</div></div>`).join("");
const c=checks.map((x,n)=>`<div class="check"><input type="checkbox" id="${k}_${n}" ${localStorage.getItem(`dw_${k}_${n}`)==="1"?"checked":""} onchange="saveCheck('${k}',${n},this.checked)"><label for="${k}_${n}">${x}</label></div>`).join("");
return `<div class="card"><h2 class="day-title">${d.icon} ${tx().days[i]}</h2><div class="sub">${d.title[lang]}</div></div>
<div class="card"><h3 class="section-title">${tx().main}</h3><ul class="list">${d.main[lang].map(x=>`<li>${x}</li>`).join("")}</ul></div>
<div class="card"><h3 class="section-title">${tx().procedure}</h3><ol class="list">${d.procedure[lang].map(x=>`<li>${x}</li>`).join("")}</ol></div>
<div class="card"><h3 class="section-title">${tx().times}</h3>${times}</div>
<div class="card"><h3 class="section-title">${tx().points}</h3><ul class="list">${d.points[lang].map(x=>`<li>${x}</li>`).join("")}</ul></div>
<div class="card"><h3 class="section-title">${tx().check}</h3><div>${tx().done}: <strong>${done}/${checks.length}</strong> (${pct}%)</div><div class="progress"><span style="width:${pct}%"></span></div>${c}<div class="actions"><button onclick="resetDay('${k}')">${tx().reset}</button></div></div>`;
}
function saveCheck(k,n,v){localStorage.setItem(`dw_${k}_${n}`,v?"1":"0");renderMain()}
function resetDay(k){D[k].check[lang].forEach((_,n)=>localStorage.removeItem(`dw_${k}_${n}`));renderMain()}
function renderTabs(){
const el=document.getElementById("tabs");el.innerHTML="";
const b=document.createElement("button");b.textContent=tx().common;b.className=current==="time"?"active":"";b.onclick=()=>setTab("time");el.appendChild(b);
keys.forEach((k,i)=>{const x=document.createElement("button");x.textContent=D[k].icon+" "+tx().days[i];x.className=current===k?"active":"";x.onclick=()=>setTab(k);el.appendChild(x)});
}
function renderLang(){document.querySelectorAll("#langBar button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang))}
function renderTimezone(){
  document.getElementById("tzLabel").textContent=tx().timezone+":";
  const sel=document.getElementById("tzSelect");
  sel.innerHTML=zoneOptions.map(([value,zone])=>`<option value="${value}" ${selectedZone===value?"selected":""}>${value==="auto"?tx().automatic:(zoneLabels[lang][zone]||zone)}</option>`).join("");
  sel.onchange=e=>setZone(e.target.value);
}
function renderMain(){document.getElementById("main").innerHTML=current==="time"?commonView():dayView(current);document.getElementById("footer").textContent=tx().save}
function renderAll(){renderLang();renderTimezone();renderTabs();renderMain()}
document.querySelectorAll("#langBar button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
renderAll();
</script>
