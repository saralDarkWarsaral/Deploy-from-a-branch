<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Dark War VS Guide</title>
<style>
:root{
  --bg:#070b17;
  --bg2:#0b1224;
  --surface:#111a30;
  --surface2:#16213a;
  --surface3:#1b2946;
  --text:#f7f9ff;
  --muted:#a9b5ca;
  --line:rgba(139,159,202,.22);
  --accent:#57e0c2;
  --accent2:#65b9ff;
  --accentText:#05241e;
  --danger:#ff7d8f;
  --shadow:0 18px 50px rgba(0,0,0,.28);
  --radius:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  background:
    radial-gradient(circle at 12% -5%,rgba(87,224,194,.13),transparent 28%),
    radial-gradient(circle at 92% 8%,rgba(101,185,255,.12),transparent 30%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 48%,#0a1020 100%);
  -webkit-font-smoothing:antialiased;
}
body:before{
  content:"";
  position:fixed;inset:0;pointer-events:none;opacity:.28;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:28px 28px;
  mask-image:linear-gradient(to bottom,black,transparent 80%);
}
.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 16px calc(34px + env(safe-area-inset-bottom));min-height:100vh}
header{
  position:sticky;top:0;z-index:20;
  margin:0 -16px;
  padding:12px 16px 14px;
  background:linear-gradient(180deg,rgba(7,11,23,.97),rgba(7,11,23,.88));
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid var(--line);
  box-shadow:0 10px 30px rgba(0,0,0,.12);
}
h1{
  display:flex;align-items:center;gap:10px;
  font-size:clamp(24px,5vw,32px);line-height:1.15;letter-spacing:-.03em;
  margin:0 0 14px;font-weight:800;
}
.lang,.tabs,.actions{display:flex;gap:9px;flex-wrap:wrap}
button,.timezone-box select{
  font:inherit;
  color:var(--text);
  border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(27,41,70,.92),rgba(17,26,48,.94));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 6px 18px rgba(0,0,0,.12);
  transition:transform .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease;
}
button{border-radius:15px;padding:10px 14px;min-height:44px;cursor:pointer}
button:active{transform:scale(.97)}
button:hover{border-color:rgba(87,224,194,.5)}
button.active{
  background:linear-gradient(135deg,var(--accent),#70ead1);
  color:var(--accentText);border-color:transparent;font-weight:800;
  box-shadow:0 10px 26px rgba(87,224,194,.20),inset 0 1px 0 rgba(255,255,255,.38);
}
.timezone-box{
  display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px;
  margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:16px;
  background:rgba(17,26,48,.64);
}
.timezone-box label{color:var(--muted);font-size:13px;white-space:nowrap;font-weight:650}
.timezone-box select{
  width:100%;min-width:0;border-radius:12px;padding:10px 38px 10px 12px;
  appearance:auto;outline:none;
}
.timezone-box select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(87,224,194,.13)}
.tabs{
  overflow-x:auto;flex-wrap:nowrap;padding:12px 2px 2px;
  scrollbar-width:none;scroll-snap-type:x proximity;
  mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 10px),transparent 100%);
}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;scroll-snap-align:start;flex:0 0 auto}
main{padding-top:2px}
.card{
  position:relative;overflow:hidden;
  background:linear-gradient(145deg,rgba(22,33,58,.96),rgba(14,23,43,.98));
  border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;margin:16px 0;box-shadow:var(--shadow);
}
.card:before{
  content:"";position:absolute;inset:0 0 auto 0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
}
.card h2{font-size:clamp(24px,6vw,34px);letter-spacing:-.025em;margin:0 0 12px}
.day-title{font-size:clamp(28px,7vw,38px)!important;margin:0 0 7px!important}
.sub{color:var(--muted);font-size:14px;line-height:1.55;font-weight:600;letter-spacing:.02em}
.section-title{
  display:flex;align-items:center;gap:8px;
  font-size:18px;margin:0 0 14px;padding-bottom:13px;border-bottom:1px solid var(--line);
  letter-spacing:.01em;
}
.list{padding-left:1.35em;margin:0;line-height:1.72}
.list li{padding-left:.25em;margin:.38em 0}
.list li::marker{color:var(--accent)}
.note{
  margin:0 0 15px;padding:13px 14px;border-radius:15px;
  background:rgba(8,15,31,.58);border:1px solid rgba(139,159,202,.16);
  font-size:13px;line-height:1.75;color:var(--muted)
}
.time-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:16px}
.time-grid{
  display:grid;grid-template-columns:minmax(125px,.9fr) minmax(165px,1.1fr);
  min-width:360px;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:16px;overflow:hidden;font-size:13px;
}
.time-grid div{background:rgba(14,23,43,.98);padding:12px 8px;text-align:center;line-height:1.25}
.time-grid .head{
  font-weight:800;background:linear-gradient(180deg,#263553,#202d48);
  color:#fff;letter-spacing:.01em;
}
.task-time{
  position:relative;background:rgba(8,15,31,.62);border:1px solid var(--line);
  border-radius:16px;padding:14px 14px 14px 17px;margin:11px 0;
}
.task-time:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(var(--accent),var(--accent2))}
.task-time strong{display:block;margin-bottom:9px;line-height:1.45;font-size:15px}
.task-time div{line-height:1.65;color:var(--muted);font-size:13px}
.check{
  display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)
}
.check:last-child{border-bottom:0}
.check input{
  width:24px;height:24px;margin-top:0;accent-color:var(--accent);flex:0 0 auto
}
.check label{line-height:1.48;flex:1}
.progress{
  height:10px;background:rgba(5,10,22,.7);border:1px solid rgba(139,159,202,.14);
  border-radius:999px;overflow:hidden;margin:12px 0 16px
}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 14px rgba(87,224,194,.35);transition:width .3s ease}
.actions{margin-top:14px}.actions button{color:var(--muted)}
footer{font-size:12px;color:var(--muted);text-align:center;padding:24px 8px 8px;line-height:1.6}
@media(max-width:520px){
  .app{padding-left:12px;padding-right:12px}
  header{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}
  .lang{display:grid;grid-template-columns:repeat(3,1fr)}
  .lang button{padding:9px 7px;font-size:14px;white-space:nowrap}
  .timezone-box{grid-template-columns:1fr;gap:6px}
  .timezone-box label{font-size:12px}
  .card{padding:17px;border-radius:20px;margin:13px 0}
  .time-grid{font-size:12px;min-width:330px}.time-grid div{padding:11px 5px}
  .tabs button{font-size:14px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

.language-box{
  display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px;
  margin-bottom:10px;padding:10px 12px;border:1px solid var(--line);border-radius:16px;
  background:rgba(17,26,48,.64);
}
.language-box label{color:var(--muted);font-size:13px;white-space:nowrap;font-weight:700}
.language-box select{
  width:100%;min-width:0;border-radius:12px;padding:11px 38px 11px 12px;
  color:var(--text);border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(27,41,70,.94),rgba(17,26,48,.96));
  font:inherit;outline:none;
}
html[dir="rtl"] body{font-family:"Segoe UI",Tahoma,Arial,sans-serif}
html[dir="rtl"] .language-box,html[dir="rtl"] .timezone-box{grid-template-columns:minmax(0,1fr) auto}
html[dir="rtl"] .language-box label,html[dir="rtl"] .timezone-box label{text-align:right}
html[dir="rtl"] .list{padding-left:0;padding-right:1.35em}
html[dir="rtl"] .check{flex-direction:row-reverse;text-align:right}
html[dir="rtl"] .tabs{direction:rtl}
html[dir="rtl"] .task-time{text-align:right}


.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.status-box{border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(12,20,38,.72)}
.status-box.now{box-shadow:0 0 0 1px rgba(92,226,199,.25),0 10px 30px rgba(0,0,0,.16)}
.status-kicker{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.status-time{font-size:21px;font-weight:850;margin:5px 0}
.status-sub{font-size:13px;color:var(--muted);line-height:1.45}
.rotation-note{font-size:12px;color:var(--muted);margin-top:8px}
.time-grid .current-row{background:rgba(92,226,199,.10);font-weight:800}
@media(max-width:560px){.status-grid{grid-template-columns:1fr}}


body{padding-bottom:78px}
.brand-link{display:block;color:inherit;text-decoration:none;cursor:pointer}
.brand-link:active{transform:translateY(1px)}
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(7,18,29,.96);backdrop-filter:blur(14px);
  border-top:1px solid rgba(115,218,211,.25);
  padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
}
.bottom-nav button{
  border:0;background:transparent;color:#9eb7c2;padding:5px 2px;
  font:inherit;font-size:11px;display:grid;gap:2px;place-items:center;border-radius:12px;
}
.bottom-nav button .nav-icon{font-size:21px;line-height:1}
.bottom-nav button.active{color:#72e2da;background:rgba(76,211,203,.10)}
.hero-panel{
  border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;
  background:
    radial-gradient(circle at 92% 10%,rgba(75,222,213,.18),transparent 34%),
    linear-gradient(160deg,rgba(18,47,60,.96),rgba(11,22,39,.98));
}
.hero-panel h2{margin:0 0 5px;font-size:25px}
.hero-panel p{color:var(--muted);margin:0;line-height:1.55}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.quick-card,.event-card{
  border:1px solid var(--line);border-radius:17px;padding:14px;
  background:rgba(13,25,43,.86)
}
.quick-card button{width:100%;text-align:left}
.event-list{display:grid;gap:11px}
.event-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.event-title{font-size:17px;font-weight:850}
.event-meta{color:var(--muted);font-size:13px;line-height:1.55;margin-top:7px}
.event-time{font-size:23px;font-weight:900;color:#75e2d9}
.event-badge{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:rgba(255,179,71,.14);color:#ffc76c}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.settings-grid label{font-size:12px;color:var(--muted)}
.settings-grid input,.settings-grid select{
  width:100%;box-sizing:border-box;margin-top:5px;border:1px solid var(--line);
  border-radius:11px;padding:10px;background:#0f1c31;color:var(--text);font:inherit
}
.event-actions{display:flex;gap:8px;margin-top:11px}
.event-actions button{flex:1}
.today-list{display:grid;gap:8px}
.today-item{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:13px;background:rgba(13,25,43,.7)}
.today-item input{width:20px;height:20px}
.small-note{font-size:12px;color:var(--muted);line-height:1.55}
.page-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
.page-title h2{margin:0}
@media(max-width:560px){
  .quick-grid,.settings-grid{grid-template-columns:1fr}
  header{padding-bottom:7px}
}


.schedule-section{display:grid;gap:12px}
.schedule-date{
  text-align:center;font-weight:900;font-size:18px;
  background:linear-gradient(180deg,#f7c47b,#efaa58);
  color:#3a2417;border-radius:14px;padding:10px 14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5)
}
.schedule-card{
  display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;
  border:1px solid var(--line);border-radius:17px;padding:13px;
  background:linear-gradient(180deg,rgba(19,32,52,.96),rgba(13,24,40,.96));
}
.schedule-icon{
  width:64px;height:64px;border-radius:14px;
  display:grid;place-items:center;font-size:34px;
  background:linear-gradient(145deg,rgba(60,106,133,.55),rgba(20,45,69,.7));
  border:1px solid rgba(255,255,255,.08)
}
.schedule-main{min-width:0}
.schedule-title{font-size:17px;font-weight:900;line-height:1.25}
.schedule-sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
.schedule-time{text-align:right}
.schedule-time .local{font-size:22px;font-weight:900;color:#79e0d8}
.schedule-time .server{font-size:12px;color:var(--muted);margin-top:3px}
.schedule-time .count{font-size:12px;color:#ffc66d;margin-top:4px}
.schedule-edit{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.06);padding-top:10px}
.round-times{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.round-pill{
  border:1px solid var(--line);border-radius:12px;padding:9px 10px;
  background:rgba(12,21,36,.72);font-size:13px
}
.round-pill strong{display:block;color:var(--text);font-size:15px;margin-top:3px}
@media(max-width:560px){
  .schedule-card{grid-template-columns:54px 1fr}
  .schedule-icon{width:54px;height:54px;font-size:29px}
  .schedule-time{grid-column:1/-1;text-align:left;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  .schedule-time .local{font-size:20px}
}

</style>
</head>
<body>
<div class="app">
<header>
<a class="brand-link" id="homeBanner"><h1>🎮 Dark War VS Guide</h1></a>
<div class="language-box">
<label id="langLabel" for="langSelect">🌐 言語</label>
<select id="langSelect" aria-label="Language">
<option value="ja">🇯🇵 日本語</option>
<option value="en">🇬🇧 English</option>
<option value="it">🇮🇹 Italiano</option>
<option value="ar">🇸🇦 العربية</option>
<option value="ko">🇰🇷 한국어</option>
<option value="zh-CN">🇨🇳 简体中文</option>
<option value="zh-TW">🇹🇼 繁體中文</option>
<option value="es">🇪🇸 Español</option>
<option value="fr">🇫🇷 Français</option>
<option value="de">🇩🇪 Deutsch</option>
<option value="pt">🇵🇹 Português</option>
<option value="ru">🇷🇺 Русский</option>
<option value="tr">🇹🇷 Türkçe</option>
</select>
</div>
<div class="timezone-box"><label id="tzLabel" for="tzSelect"></label><select id="tzSelect"></select></div>
<div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
<footer id="footer"></footer>
</div>
<nav class="bottom-nav" id="bottomNav">
<button data-page="home"><span class="nav-icon">🏠</span><span id="navHome">Home</span></button>
<button data-page="vs"><span class="nav-icon">⚔️</span><span>VS</span></button>
<button data-page="alliance"><span class="nav-icon">🤝</span><span id="navAlliance">Alliance</span></button>
<button data-page="world"><span class="nav-icon">🌍</span><span id="navWorld">World Time</span></button>
</nav>

<script>

const UI={
ja:{target:"対象",leaderDecides:"リーダー設定",round1:"1回目",round2:"2回目",tomorrow:"明日",seasonDay:"シーズン日程",unset:"未設定",home:"ホーム",alliance:"同盟",world:"世界時間",today:"今日やること",openVS:"VS攻略を見る",openAlliance:"同盟イベントを見る",currentTask:"今やること",nextEvent:"次の同盟イベント",noSchedule:"時刻未設定",edit:"設定",saveEvent:"保存",team:"チーム",rounds:"回数・ラウンド",serverTime:"サーバー時刻",enabled:"表示する",manualNote:"同盟ごとに開催時刻や回数が異なるため、この端末で設定します。設定後は現地時間とカウントダウンを自動表示します。",schedule:"同盟イベント予定",checkToday:"今日のチェック",vs:"VS",frankie:"バイオモンスター（フランキー）",military:"軍事庫争奪戦",blackGold:"黒金戦場",president:"大統領戦",zombie:"ゾンビ襲来",champion:"チャンピオン対決",season:"シーズンイベント",localTime:"現地時間",until:"開始まで",everyday:"毎日",custom:"同盟設定"},
en:{target:"Target",leaderDecides:"Leader setting",round1:"Round 1",round2:"Round 2",tomorrow:"Tomorrow",seasonDay:"Season schedule",unset:"Not set",home:"Home",alliance:"Alliance",world:"World Time",today:"What to do today",openVS:"Open VS guide",openAlliance:"Open Alliance events",currentTask:"What to do now",nextEvent:"Next Alliance event",noSchedule:"Time not set",edit:"Settings",saveEvent:"Save",team:"Team",rounds:"Rounds",serverTime:"Server time",enabled:"Show",manualNote:"Alliance times and round counts differ, so set them on this device. Local time and countdown update automatically.",schedule:"Alliance event schedule",checkToday:"Today's checklist",vs:"VS",frankie:"Bio Monster (Frankie)",military:"Military Depot",blackGold:"Black Gold Battlefield",president:"President Battle",zombie:"Zombie Siege",champion:"Champion Duel",season:"Season Events",localTime:"Local time",until:"Starts in",everyday:"Daily",custom:"Alliance setting"},
it:{target:"Obiettivo",leaderDecides:"Impostazione leader",round1:"Round 1",round2:"Round 2",tomorrow:"Domani",seasonDay:"Programma stagione",unset:"Non impostato",home:"Home",alliance:"Alleanza",world:"Ora mondiale",today:"Cosa fare oggi",openVS:"Apri guida VS",openAlliance:"Apri eventi Alleanza",currentTask:"Cosa fare adesso",nextEvent:"Prossimo evento Alleanza",noSchedule:"Orario non impostato",edit:"Impostazioni",saveEvent:"Salva",team:"Squadra",rounds:"Round",serverTime:"Ora server",enabled:"Mostra",manualNote:"Orari e round cambiano per ogni Alleanza. Impostali su questo dispositivo; ora locale e conto alla rovescia saranno automatici.",schedule:"Programma eventi Alleanza",checkToday:"Checklist di oggi",vs:"VS",frankie:"Bio Monster (Frankie)",military:"Deposito militare",blackGold:"Campo Oro Nero",president:"Battaglia presidenziale",zombie:"Assalto Zombie",champion:"Duello dei Campioni",season:"Eventi stagionali",localTime:"Ora locale",until:"Inizia tra",everyday:"Ogni giorno",custom:"Impostazione Alleanza"}
};
function ui(){return UI[lang]||UI.en}
const DEFAULT_EVENTS=[
 {id:"military",icon:"🏛️",time:"02:00",target:"5",team:"",rounds:"1",enabled:true,mode:"fixed"},
 {id:"frankie",icon:"🧪",times:["06:00","18:00"],team:"2",rounds:"2",enabled:true,mode:"leader"},
 {id:"blackGold",icon:"💎",time:"12:00",target:"",team:"",rounds:"1",enabled:true,mode:"fixed"},
 {id:"zombie",icon:"🧟",time:"",target:"",team:"",rounds:"22",enabled:false,mode:"leader"},
 {id:"president",icon:"👑",time:"",target:"",team:"",rounds:"",enabled:false,mode:"optional"}
];
function loadAllianceEvents(){
 try{
  const x=JSON.parse(localStorage.getItem("dw_alliance_events"));
  return Array.isArray(x)?x:structuredClone(DEFAULT_EVENTS);
 }catch(e){return structuredClone(DEFAULT_EVENTS)}
}
let allianceEvents=loadAllianceEvents();
function saveAllianceEvents(){localStorage.setItem("dw_alliance_events",JSON.stringify(allianceEvents))}
function eventName(id){return ui()[id]||id}
function serverPointToDate(hm,dayOffset=0){
 if(!hm)return null;
 const [h,m]=hm.split(":").map(Number);
 const n=new Date();
 let t=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+dayOffset,h+2,m,0);
 return new Date(t);
}
function pointLocal(hm){
 const d=serverPointToDate(hm,0);
 if(!d)return ui().noSchedule;
 return new Intl.DateTimeFormat(LOCALES[lang]||"en-GB",{timeZone:activeZone(),hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
}

function eventTimes(ev){
 if(Array.isArray(ev.times))return ev.times.filter(Boolean);
 return ev.time?[ev.time]:[];
}
function nextOccurrenceForTime(hm){
 if(!hm)return null;
 const now=Date.now();
 let d=serverPointToDate(hm,0);
 if(d.getTime()<=now)d=serverPointToDate(hm,1);
 return d;
}
function nextEventOccurrence(ev){
 const dates=eventTimes(ev).map(nextOccurrenceForTime).filter(Boolean).sort((a,b)=>a-b);
 return dates[0]||null;
}

function nextAllianceEvent(){
 const list=[];
 allianceEvents.forEach(ev=>{
  if(!ev.enabled)return;
  eventTimes(ev).forEach(time=>{
   const date=nextOccurrenceForTime(time);
   if(date)list.push({ev,time,date});
  });
 });
 return list.sort((a,b)=>a.date-b.date)[0]||null;
}

procedure:{ja:["火曜日と同様にレーダーを使い切る。","Lv20以上の集結ゾンビをひたすら倒す。","ヒーローチケット、加速宝箱、ダイヤ、歯車、回復加速、訓練加速、資源、肉を集める。","メイン1軍で高レベル集結を行う。時間がなければ2軍・3軍も使う。","目標は約1M。不足分は建築・研究・車強化で補う。","木曜日の研究では知恵勲章を使わない。木曜日のVS対象外。"],it:["Usa il Radar come il martedì.","Sconfiggi continuamente Zombie in Rally di livello 20 o superiore.","Raccogli Biglietti Eroe, Casse Accelerazione, Diamanti, Ingranaggi, acceleratori, Risorse e Carne.","Usa principalmente la squadra principale; se manca tempo, usa anche la seconda o terza squadra.","Obiettivo consigliato: circa 1M. Compensa con Costruzione, Ricerca o Potenziamento Veicoli.","Non usare Medaglie della Saggezza nella Ricerca del giovedì: non danno punti VS quel giorno."],en:["Use Radar as on Tuesday.","Continuously defeat level 20 or higher Rally Zombies.","Collect Hero Tickets, Speedup Chests, Diamonds, Gears, speedups, Resources, and Meat.","Use the main squad; if time is short, also use the second or third squad.","Recommended target: about 1M. Compensate with Construction, Research, or Vehicle Upgrades.","Do not use Wisdom Medals in Thursday Research; they do not score VS points that day."]},

D.monday.title.ar="الجمع・البناء・البحث الكيميائي";
D.monday.main.ar=["🌲 جمع الموارد","🏗 البناء","🔬 البحث الكيميائي"];
D.monday.procedure.ar=["من مساء الأحد، أرسل جميع الفرق لجمع الموارد.","اضبط الوقت بحيث تعود الفرق بعد إعادة ضبط يوم الخادم.","اجمع الخشب أو الحجر أو الكهرباء. يُنصح بالمستوى 8. لا تختر العملات.","احصل على تعزيز وزير الزراعة ثم واصل الجمع.","قبل نهاية يوم الخادم، تأكد من عودة جميع الفرق واستدعها يدويًا عند الحاجة.","عندما يكون عدد كبير من اللاعبين متصلًا، أكملوا 50 زومبي يوميًا معًا أو اترك فريقًا واحدًا للراليات."];
D.monday.points.ar=["يمكن الحصول على نحو 2M نقطة من الجمع وحده.","إذا كنت VIP7 أو أعلى، يمكنك تغيير السمة ونقل البناء أو البحث إلى وقت أنسب.","يُنصح بتنفيذ الأنشطة أثناء تفعيل جميع تعزيزات الرئاسة."];
D.monday.check.ar=["إرسال الفرق للجمع من يوم الأحد","اختيار الخشب أو الحجر أو الكهرباء","تفضيل موارد المستوى 8","عدم جمع العملات","الحصول على تعزيز وزير الزراعة","التحقق من عودة الفرق","تنفيذ البناء","تنفيذ البحث الكيميائي"];

D.tuesday.procedure.ar=["النشاط الرئيسي هو استدعاء الأبطال.","ابدأ بتجميع مهام الرادار من يوم الأحد.","في نهاية الاثنين، ارفع الرادار إلى الحد الأقصى.","إذا كان لديك Catherine أو Alex، فاستخدمهما بعد وصول الرادار إلى الحد الأقصى.","ادخر 200 ميدالية على الأقل لاستخدامها يوم الثلاثاء.","الاستدعاءات تمنح نقاط VS يوم الثلاثاء فقط."];
D.tuesday.points.ar=["إذا كنت VIP7 أو أعلى، يمكنك تغيير السمة.","يمكنك نقل تطوير الأبطال إلى فترة زمنية أخرى.","اختيار التدريب في فترة الخادم 15:00–19:00 قد يسمح بفتح الصناديق دون إكمال جميع أنشطة الأبطال."];
D.tuesday.check.ar=["تجميع الرادار من يوم الأحد","رفع الرادار إلى الحد الأقصى قبل الثلاثاء","استخدام Catherine أو Alex بعد الحد الأقصى","ادخار 200 ميدالية على الأقل","تنفيذ 100 استدعاء","استخدام شظايا الأبطال"];
D.wednesday.title.ar="تدريب الجنود・معدات الأبطال";

function serverRangeToZone(range,zone=activeZone()){
  const m=range.match(/^(\d{2}):(\d{2})[–-](\d{2}):(\d{2})$/);
  if(!m)return range;
  const now=new Date();
  const y=now.getUTCFullYear(),mo=now.getUTCMonth(),d=now.getUTCDate();
  const start=Date.UTC(y,mo,d,Number(m[1])+2,Number(m[2])); // Server time = UTC−2
  let end=Date.UTC(y,mo,d,Number(m[3])+2,Number(m[4]));
  if(end<=start)end+=86400000;
  const locale=LOCALES[lang]||"en-GB";
  const fmt=new Intl.DateTimeFormat(locale,{timeZone:zone,hour:"2-digit",minute:"2-digit",hour12:false});
  return `${fmt.format(new Date(start))}–${fmt.format(new Date(end))}`;
}

function parseServerRange(range,baseDate=new Date()){
  const m=range.match(/^(\d{2}):(\d{2})[–-](\d{2}):(\d{2})$/);
  if(!m)return null;
  const y=baseDate.getUTCFullYear(),mo=baseDate.getUTCMonth(),d=baseDate.getUTCDate();
  let start=Date.UTC(y,mo,d,Number(m[1])+2,Number(m[2]));
  let end=Date.UTC(y,mo,d,Number(m[3])+2,Number(m[4]));
  if(end<=start)end+=86400000;
  return {start,end};
}
function localStartMinutes(range){
  const p=parseServerRange(range);
  if(!p)return 0;
  const parts=new Intl.DateTimeFormat("en-GB",{timeZone:activeZone(),hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date(p.start));
  const h=Number(parts.find(x=>x.type==="hour")?.value||0)%24;
  const m=Number(parts.find(x=>x.type==="minute")?.value||0);
  return h*60+m;
}
function formatDuration(ms){
  const total=Math.max(0,Math.ceil(ms/60000));
  const h=Math.floor(total/60),m=total%60;
  if(lang==="ja")return h?`${h}時間${m}分`:`${m}分`;
  if(lang==="ko")return h?`${h}시간 ${m}분`:`${m}분`;
  if(lang==="zh-CN"||lang==="zh-TW")return h?`${h}小时 ${m}分钟`:`${m}分钟`;
  if(lang==="ar")return h?`${h} س ${m} د`:`${m} د`;
  return h?`${h}h ${m}m`:`${m}m`;
}
function currentAndNextSlots(){
  const now=Date.now();
  const candidates=[];
  for(let dayOffset=-1;dayOffset<=1;dayOffset++){
    const base=new Date(Date.now()+dayOffset*86400000);
    commonTimes.forEach((r,index)=>{
      const p=parseServerRange(r[0],base);
      candidates.push({index,range:r[0],...p});
    });
  }
  const currentSlot=candidates.find(x=>now>=x.start&&now<x.end);
  const nextSlot=candidates.filter(x=>x.start>now).sort((a,b)=>a.start-b.start)[0];
  return {currentSlot,nextSlot,now};
}
function statusView(){
  const {currentSlot,nextSlot,now}=currentAndNextSlots();
  if(!currentSlot||!nextSlot)return "";
  return `<div class="status-grid">
    <div class="status-box now"><div class="status-kicker">🟢 ${tx().now}</div>
      <div class="status-time">${serverRangeToZone(currentSlot.range)}</div>
      <div class="status-sub">${tx().server}: ${currentSlot.range}<br>${tx().remaining}: ${formatDuration(currentSlot.end-now)}</div>
    </div>
    <div class="status-box"><div class="status-kicker">⏭ ${tx().next}</div>
      <div class="status-time">${serverRangeToZone(nextSlot.range)}</div>
      <div class="status-sub">${tx().server}: ${nextSlot.range}<br>${tx().startsIn}: ${formatDuration(nextSlot.start-now)}</div>
    </div>
  </div>`;
}

}

}).join("");
